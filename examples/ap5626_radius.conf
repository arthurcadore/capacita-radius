#
 version 7.1.064, Release 2605P06
#
 sysname INTELBRAS
#
 clock timezone Beijing add 08:00:00
#
 undo copyright-info enable
#
wlan global-configuration
#
 dot1x authentication-method eap
#
 port-security enable
#
 dns proxy enable
 ip host gwstart.intelbras.com 10.0.0.1
 ip host myap.intelbras.com 10.0.0.1
 ip host wlan.intelbras.com 10.0.0.1
#
 lldp global enable
 lldp hold-multiplier 8
#
 password-recovery enable
#
vlan 1
#
vlan 20
#
wlan service-template 1
 ssid !!VLAN20_DINAMICA
 akm mode dot1x
 cipher-suite ccmp
 security-ie wpa
 client-security authentication-mode dot1x
 dot1x domain wifi
 service-template enable
#
wlan service-template 2
 ssid !!!!!!SEMRADIUS
 vlan 20
 akm mode psk
 preshared-key pass-phrase cipher $c$3$QCQjL+ewgR9fuwlI4lMnAbWg2taXsBBe6cHq
 cipher-suite ccmp
 security-ie wpa
 service-template enable
#
interface NULL0
#
interface Vlan-interface1
 ip address dhcp-alloc
 tcp mss 1400
 ipv6 address dhcp-alloc
#
interface Vlan-interface20
 ip address dhcp-alloc
 tcp mss 1400
#
interface GigabitEthernet1/0/1
 port link-type trunk
 port trunk permit vlan 1 20
 port-isolate enable
 broadcast-suppression pps 100
 multicast-suppression pps 100
#
interface WLAN-Radio1/0/1
 service-template 1
 service-template 2
#
interface WLAN-Radio1/0/2
#
interface Smartrate-Ethernet1/0/1
 port link-type trunk
 port trunk permit vlan 1 20
 port-isolate enable
 broadcast-suppression pps 100
 multicast-suppression pps 100
#
 scheduler logfile size 16
#
line class console
 user-role network-admin
#
line class vty
 user-role network-operator
#
line con 0
 user-role network-admin
#
line vty 0 63
 authentication-mode scheme
 user-role network-operator
#
 ntp-service enable
 ntp-service unicast-server pool.ntp.org
 ntp-service unicast-server registry.intelbras.com priority
 ntp-service unicast-server time.nist.gov
 ntp-service unicast-server time.windows.com
#
acl advanced name default
 rule 0 permit ip source 10.0.0.0 0.0.0.255
 rule 1 permit ip source 127.0.0.1 0
#
 password-control length 8
 password-control composition type-number 4 type-length 1
 undo password-control complexity user-name check
#
 radius-server test-profile radius-wifi username user20
#
radius scheme radius-wifi
 primary authentication 192.168.23.65
 primary accounting 192.168.23.65
 key authentication cipher $c$3$QxwRCGFHhEpeyyNpDFB5LtO89H/RtXOGCflbc2Q=
 key accounting cipher $c$3$aN7PyyAbNQ3jdvyjMiJltENPmy2Ytkrq829u1Eo=
 user-name-format without-domain
#
domain cloud
 authentication portal none
 authorization portal none
 accounting portal none
#
domain system
#
domain wifi
 authentication lan-access radius-scheme radius-wifi
 authorization lan-access radius-scheme radius-wifi
 accounting lan-access radius-scheme radius-wifi
 authentication ppp radius-scheme radius-wifi
 authorization ppp radius-scheme radius-wifi
 accounting ppp radius-scheme radius-wifi
#
 domain default enable system
#
aaa nas-id profile 1
#
role name level-0
 description Predefined level-0 role
#
role name level-1
 description Predefined level-1 role
#
role name level-2
 description Predefined level-2 role
#
role name level-3
