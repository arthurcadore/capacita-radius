#
user-group system
#
local-user admin class manage
 password hash $h$6$JzHBmuJW9Df1ALmN$+cKUK6uku08wAVhvNWlBYv03fBOeNssrtLKLVCaeCGgzGUnMbOtg6b0Z1Ut2j8JymHbr1EDnueEtJ+rgn+3OyA==
